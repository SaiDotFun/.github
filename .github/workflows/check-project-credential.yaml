name: Check Project automation credential

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-read-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify credential identity and access without mutations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NIBIRU_PM }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '::error::NIBIRU_PM is unavailable to this repository.'
            exit 1
          fi
          actor=$(gh api user --jq .login)
          printf 'Automation actor: %s\n' "$actor"
          gh api graphql --input - --jq '
            .data as $d |
            if ($d.project.id != "PVT_kwDOFUY1HM4BryhA" or
                $d.project.owner.id != "O_kgDOFUY1HA" or
                $d.project.public != true or
                $d.project.viewerCanUpdate != true or
                ([$d.saiWeb, $d.saiPerps, $d.nibiWeb, $d.ui] |
                 any(. == null or .isPrivate != true or .viewerPermission == null)))
            then error("Credential lacks required destination Project or private repository access")
            else {
              project: $d.project,
              repositories: [$d.saiWeb, $d.saiPerps, $d.nibiWeb, $d.ui]
            } end' <<'JSON'
          {
            "query": "query { project:node(id:\"PVT_kwDOFUY1HM4BryhA\") { ... on ProjectV2 { id public viewerCanUpdate owner { ... on Organization { id } } } } saiWeb:repository(owner:\"SaiDotFun\",name:\"sai-web\") { id isPrivate viewerPermission } saiPerps:repository(owner:\"SaiDotFun\",name:\"sai-perps\") { id isPrivate viewerPermission } nibiWeb:repository(owner:\"SaiDotFun\",name:\"nibi-web\") { id isPrivate viewerPermission } ui:repository(owner:\"SaiDotFun\",name:\"ui-nibi\") { id isPrivate viewerPermission } }"
          }
          JSON
